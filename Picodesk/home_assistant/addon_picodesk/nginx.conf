worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stdout warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_max_body_size 2m;

    # Der Pico beantwortet Anfragen nacheinander. Status-Abfragen werden
    # deshalb kurz zwischengespeichert und gebuendelt: egal wie viele Tabs
    # offen sind, geht pro Status-Adresse hoechstens alle 2 s eine Anfrage
    # an den Pico. Befehle (aktion/start/stop/...) werden nie gecacht.
    proxy_cache_path /tmp/cache levels=1 keys_zone=pico:1m max_size=10m inactive=10m;

    server {
        listen 8099;
        # Nur der Ingress-Proxy von Home Assistant darf zugreifen
        allow 172.30.32.2;
        deny all;

        proxy_http_version 1.0;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;

        # Die Seiten des Pico nutzen absolute Pfade ("/info", "/aktion/..."),
        # hinter Ingress liegt alles aber unter /api/hassio_ingress/<token>/ -
        # deshalb beim Durchleiten in relative Pfade umschreiben.
        sub_filter_once off;
        sub_filter "fetch('/" "fetch('./";
        sub_filter "anfrage('/" "anfrage('./";
        sub_filter 'href="/' 'href="./';

        # Status-Abfragen: 2 s Cache, gebuendelt, bei Fehler alter Wert
        location ~ ^/(info|verlauf|automatik/status|anwesenheit/status|wlan/status|dateien/liste)$ {
            proxy_pass __PICO_URL__;
            proxy_cache pico;
            proxy_cache_key $uri;
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 20s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_background_update on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header Cache-Control "no-store" always;
        }

        # Seiten (HTML) laenger zwischenspeichern
        location ~ ^/(|index\.html|einstellungen(\.html)?|dateien(\.html)?)$ {
            proxy_pass __PICO_URL__;
            proxy_cache pico;
            proxy_cache_key $uri;
            proxy_cache_valid 200 5m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_use_stale error timeout updating;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header Cache-Control "no-store" always;
        }

        # Alles andere (Befehle, Uploads) direkt durchreichen
        location / {
            proxy_pass __PICO_URL__;
        }
    }
}
