name: Picodesk
version: "1.0.5"
slug: picodesk
description: Weboberflaeche des Pico-Tischs direkt in Home Assistant (auch von unterwegs / in der App)
url: https://github.com/Devilwitha/Pico
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:desk
panel_title: Tisch
options:
  pico_url: "http://192.168.1.100"
schema:
  pico_url: url
